<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<tbody th:fragment="eventCard(eventTitle, eventDate, severity, severityColor, summary, impact, precautions, eventUrl)">
    <tr>
        <td style="padding:24px 32px 8px 32px;">
            <span th:text="${severity}"
                  th:style="'display:inline-block; padding:4px 12px; border-radius:12px; font-size:12px; font-weight:bold; color:#ffffff; background-color:' + ${severityColor} + ';'">
                SEVERITY
            </span>
        </td>
    </tr>
    <tr>
        <td style="padding:8px 32px 0 32px;">
            <h1 style="font-size:20px; margin:0 0 4px 0;" th:text="${eventTitle}">Event title</h1>
            <p style="font-size:13px; color:#6b7280; margin:0 0 16px 0;" th:text="${eventDate}">Event date</p>
        </td>
    </tr>
    <tr>
        <td style="padding:0 32px;">
            <h2 style="font-size:15px; margin:16px 0 4px 0;">Summary</h2>
            <p style="font-size:14px; line-height:1.5; margin:0;" th:text="${summary}">Summary text</p>
        </td>
    </tr>
    <tr>
        <td style="padding:0 32px;">
            <h2 style="font-size:15px; margin:16px 0 4px 0;">Impact</h2>
            <p style="font-size:14px; line-height:1.5; margin:0;" th:text="${impact}">Impact text</p>
        </td>
    </tr>
    <tr th:if="${precautions != null and !precautions.isEmpty()}">
        <td style="padding:0 32px;">
            <h2 style="font-size:15px; margin:16px 0 4px 0;">Precautions</h2>
            <ul style="font-size:14px; line-height:1.5; margin:0; padding-left:20px;">
                <li th:each="precaution : ${precautions}" th:text="${precaution}">Precaution</li>
            </ul>
        </td>
    </tr>
    <tr>
        <td style="padding:24px 32px 32px 32px;">
            <a th:href="${eventUrl}"
               style="display:inline-block; padding:10px 20px; background-color:#2563eb; color:#ffffff; text-decoration:none; border-radius:6px; font-size:14px; font-weight:bold;">
                View event on the map
            </a>
        </td>
    </tr>
</tbody>
</body>
</html>
