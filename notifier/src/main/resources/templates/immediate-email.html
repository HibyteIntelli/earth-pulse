<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${eventTitle}">Event alert</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Arial, Helvetica, sans-serif; color:#1f2933;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
                <tbody th:replace="~{email-fragments :: eventCard(eventTitle=${eventTitle}, eventDate=${eventDate}, severity=${severity}, severityColor=${severityColor}, summary=${summary}, impact=${impact}, precautions=${precautions}, eventUrl=${eventUrl})}"></tbody>
                <tr>
                    <td style="padding:16px 32px; background-color:#f9fafb; font-size:12px; color:#9ca3af;">
                        You are receiving this because you have a watch on Earth Pulse.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
