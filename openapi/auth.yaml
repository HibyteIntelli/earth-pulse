openapi: 3.0.3
info:
  title: EarthPulse — User & Subscription Service
  description: >
    Identity provider and subscription manager for the EarthPulse platform.
    Issues RSA-signed JWTs, publishes JWKS for downstream validation,
    and manages user watches (region + category subscriptions).
  version: 1.0.0

servers:
  - url: http://localhost:8083
    description: Local development

tags:
  - name: Auth
    description: Signup, login, and JWKS publication
  - name: Account
    description: Authenticated user account settings
  - name: Watches
    description: CRUD for user watches (subscriptions)
  - name: Internal
    description: Internal endpoints consumed by the Notifier Service (shared-secret protected)

# ---------------------------------------------------------------------------
# Security schemes
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by POST /auth/login

    InternalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
      description: Shared secret for internal service-to-service calls

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------
  schemas:

    # --- Auth ---------------------------------------------------------------

    SignupRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: "S3cur3P@ss!"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          example: "S3cur3P@ss!"

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Signed JWT (RS256). Carries sub, iss, iat, exp, aud claims.
          example: eyJhbGciOiJSUzI1NiJ9...

    JwksResponse:
      type: object
      description: JSON Web Key Set containing the RSA public key used to sign JWTs.
      properties:
        keys:
          type: array
          items:
            type: object
            description: JWK entry (RFC 7517)
            properties:
              kty:
                type: string
                example: RSA
              use:
                type: string
                example: sig
              kid:
                type: string
                example: "2024-01-key-1"
              alg:
                type: string
                example: RS256
              n:
                type: string
                description: RSA modulus (base64url)
              e:
                type: string
                description: RSA public exponent (base64url)
                example: AQAB

    # --- Account ------------------------------------------------------------

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        email:
          type: string
          format: email
          example: alice@example.com
        readingLevel:
          $ref: '#/components/schemas/ReadingLevel'
          description: >
            User's preferred reading level for AI briefings shown on the map.
            Defaults to `DEFAULT` on signup.

    UpdateUserRequest:
      type: object
      description: At least one field must be provided.
      properties:
        email:
          type: string
          format: email
          example: newalice@example.com
        currentPassword:
          type: string
          format: password
          description: Required when changing the password.
        newPassword:
          type: string
          format: password
          minLength: 8
          description: Required when changing the password.
        readingLevel:
          $ref: '#/components/schemas/ReadingLevel'
          description: Update the user's preferred reading level for map briefings.

    # --- Watches ------------------------------------------------------------

    BoundingBox:
      type: object
      required: [minLat, maxLat, minLon, maxLon]
      description: Rectangular geographic region in decimal degrees.
      properties:
        minLat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 36.5
        maxLat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 42.0
        minLon:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -122.5
        maxLon:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -114.0

    Point:
      type: object
      description: GeoJSON-style point at the event's primary location.
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          type: array
          items:
            type: number
            format: double
          minItems: 2
          maxItems: 2
          description: "[longitude, latitude] (GeoJSON order)."
          example: [-118.2437, 34.0522]

    DigestMode:
      type: string
      enum: [IMMEDIATE, DAILY_DIGEST]
      description: >
        `immediate` — email sent as soon as a matching event is detected.
        `daily_digest` — matches are batched and sent once per day.

    ReadingLevel:
      type: string
      enum: [DEFAULT, SIMPLIFIED]
      description: >
        Controls the complexity of the AI-generated summary.
        Used both as a per-watch notification preference and as a
        user-level preference for briefings shown on the map.

    Watch:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "w1b2c3d4-0000-0000-0000-ef1234567890"
        userId:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        boundingBox:
          $ref: '#/components/schemas/BoundingBox'
        categories:
          type: array
          minItems: 1
          items:
            type: string
          example: ["wildfires", "severeStorms"]
        digestMode:
          $ref: '#/components/schemas/DigestMode'
        readingLevel:
          $ref: '#/components/schemas/ReadingLevel'
        paused:
          type: boolean
          default: false

    CreateWatchRequest:
      type: object
      required: [boundingBox, categories, digestMode, readingLevel]
      properties:
        boundingBox:
          $ref: '#/components/schemas/BoundingBox'
        categories:
          type: array
          minItems: 1
          items:
            type: string
          example: ["wildfires", "severeStorms"]
        digestMode:
          $ref: '#/components/schemas/DigestMode'
        readingLevel:
          $ref: '#/components/schemas/ReadingLevel'

    UpdateWatchRequest:
      type: object
      description: All fields are optional; only provided fields are updated.
      properties:
        boundingBox:
          $ref: '#/components/schemas/BoundingBox'
        categories:
          type: array
          minItems: 1
          items:
            type: string
        digestMode:
          $ref: '#/components/schemas/DigestMode'
        readingLevel:
          $ref: '#/components/schemas/ReadingLevel'
        paused:
          type: boolean

    # --- Internal -----------------------------------------------------------

    EventMatchRequest:
      type: object
      required: [eventId, categories, point]
      description: >
        Sent by the Notifier Service to find all watches that match
        an incoming event.
      properties:
        eventId:
          type: string
          description: EONET event ID
          example: "EONET_6589"
        categories:
          type: array
          minItems: 1
          items:
            type: string
          example: ["wildfires"]
        point:
          $ref: '#/components/schemas/Point'

    MatchedWatch:
      type: object
      properties:
        watchId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        userEmail:
          type: string
          format: email
        digestMode:
          $ref: '#/components/schemas/DigestMode'
        readingLevel:
          $ref: '#/components/schemas/ReadingLevel'

    EventMatchResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/MatchedWatch'

    # --- Errors -------------------------------------------------------------

    ProblemDetail:
      type: object
      description: RFC 7807 problem detail.
      properties:
        type:
          type: string
          format: uri
          example: "https://earthpulse.io/errors/validation-error"
        title:
          type: string
          example: "Validation Failed"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "email: must be a valid email address"
        instance:
          type: string
          format: uri
          example: "/auth/signup"

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:

  # --- Auth -----------------------------------------------------------------

  /auth/signup:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        "201":
          description: User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "409":
          description: Email already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /auth/login:
    post:
      tags: [Auth]
      summary: Authenticate and receive a signed JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: >
            Authentication successful. The returned token carries claims:
            `sub` (user UUID), `iss` (service base URL), `iat`, `exp` (~1 h),
            `aud` (`earth-pulse`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /.well-known/jwks.json:
    get:
      tags: [Auth]
      summary: Retrieve the public JWKS used to verify JWTs
      operationId: getJwks
      description: >
        Returns the RSA public key as a JSON Web Key Set (RFC 7517).
        Downstream services (Ingestion, LLM, Notifier) fetch this at startup
        and validate incoming JWTs locally — no introspection call is needed
        after the initial fetch.
      responses:
        "200":
          description: JWKS document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwksResponse'

  # --- Account --------------------------------------------------------------

  /users/me:
    get:
      tags: [Account]
      summary: Get the authenticated user's profile
      operationId: getMyProfile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "401":
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      tags: [Account]
      summary: Update email, password, or reading level
      operationId: updateMyProfile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        "200":
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "400":
          description: Validation error or incorrect current password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "401":
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "409":
          description: New email already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # --- Watches --------------------------------------------------------------

  /watches:
    get:
      tags: [Watches]
      summary: List all watches for the authenticated user
      operationId: listWatches
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Array of watches owned by the authenticated user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Watch'
        "401":
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    post:
      tags: [Watches]
      summary: Create a new watch
      operationId: createWatch
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWatchRequest'
      responses:
        "201":
          description: Watch created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watch'
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "401":
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /watches/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Watch UUID.

    get:
      tags: [Watches]
      summary: Get a specific watch
      operationId: getWatch
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Watch detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watch'
        "401":
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "403":
          description: Watch belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "404":
          description: Watch not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      tags: [Watches]
      summary: Update a watch
      operationId: updateWatch
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWatchRequest'
      responses:
        "200":
          description: Updated watch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watch'
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "401":
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "403":
          description: Watch belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "404":
          description: Watch not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    delete:
      tags: [Watches]
      summary: Delete a watch
      operationId: deleteWatch
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Watch deleted.
        "401":
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "403":
          description: Watch belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "404":
          description: Watch not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /watches/{id}/pause:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid

    patch:
      tags: [Watches]
      summary: Toggle the state of a watch
      operationId: toggleWatchPause
      description: >
        Toggles the `paused` field: pauses an active watch or resumes a paused one.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Watch with updated paused state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Watch'
        "401":
          description: Missing or invalid JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "403":
          description: Watch belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "404":
          description: Watch not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  

  # --- Internal (Notifier) --------------------------------------------------

  /internal/watches/match:
    post:
      tags: [Internal]
      summary: Find watches matching an incoming event
      operationId: matchWatches
      description: >
        Called by the Notifier Service after a new event is detected.
        Returns all non-paused watches whose bounding box contains the
        event's point **and** whose category list intersects the
        event's categories.
        Protected by the `X-Internal-Secret` header — not accessible to
        end users or the frontend.
      security:
        - InternalSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventMatchRequest'
      responses:
        "200":
          description: List of matched watches (may be empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventMatchResponse'
        "400":
          description: Validation error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "401":
          description: Missing or invalid internal secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
