openapi: 3.0.3
info:
  title: Earth Pulse - Ingestion Service
  version: 1.0.0
  description: |
    Polls NASA EONET and owns the natural-event store. Read-only API
    consumed by the frontend (map view) and the Notifier (polling for
    newly ingested events).

    This service also pushes new-event notifications to the Notifier;
    that outbound call is documented in the Notifier's spec, not here.

servers:
  - url: http://localhost:8081
    description: Local dev

tags:
  - name: events
    description: Natural-event resources sourced from NASA EONET.
  - name: categories
    description: EONET category catalogue used by the filter UI.
  - name: internal
    description: Internal endpoints consumed by other services (shared-secret protected).

paths:
  /events/search:
    post:
      operationId: searchEvents
      tags: [events]
      summary: List events matching filters.
      description: |
        Read endpoint backing the map view. All filters are optional and
        composable (AND). When no filters are supplied, returns the most
        recent active events up to `limit`, sorted by `eventDate` desc.

        Filters are passed as a JSON body rather than query parameters:
        there are many of them, some are arrays (e.g. `category`), and
        URL-encoding arrays as query params is awkward. Despite using
        `POST`, this is a read-only search and has no side effects.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventFilters'
      responses:
        '200':
          description: Page of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /events/{id}:
    get:
      operationId: getEventById
      tags: [events]
      summary: Get a single event by id.
      description: |
        Backs shareable deep links. The `id` is the EONET event id we
        ingested (e.g. `EONET_6543`).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "EONET_6543"
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /internal/events/{id}:
    get:
      operationId: getInternalEventById
      tags: [internal]
      summary: Get a single event by id (internal).
      description: |
        Identical to `GET /events/{id}` but secured with a shared secret
        instead of a JWT. Used by internal services (e.g. the Notifier)
        that cannot obtain a user-scoped JWT.
      security:
        - internalSecret: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "EONET_6543"
      responses:
        '200':
          description: The event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          description: Missing or invalid X-Internal-Secret header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List EONET event categories.
      description: |
        Drives the category filter UI on the frontend. Returns only the
        categories that currently have at least one ingested event, not the
        full `CategoryId` set.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by the Auth service (see `auth.yaml`, POST /auth/login).
        Validated locally against the Auth service's JWKS. Required by all
        read endpoints; consumers (frontend map view, Notifier) send it as
        an `Authorization: Bearer <token>` header.

    internalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
      description: Shared secret for internal service-to-service calls. Not accessible to end users or the frontend.

  schemas:
    CategoryId:
      type: string
      description: |
        An EONET category id. This enum is the full closed set of categories
        this service can ingest. Note: `GET /categories` returns only the
        subset that currently has at least one ingested event.
      enum:
        - drought
        - dustHaze
        - earthquakes
        - floods
        - landslides
        - manmade
        - seaLakeIce
        - severeStorms
        - snow
        - tempExtremes
        - volcanoes
        - waterColor
        - wildfires
      example: wildfires

    EventFilters:
      type: object
      description: |
        Filter/sort/paging options for `POST /events/search`. All filter
        fields are optional and AND-composed.
      properties:
        bbox:
          type: string
          description: |
            Bounding box as `west,south,east,north` in WGS84 decimal degrees,
            matching NASA EONET's bbox format. Used by the frontend to fetch
            only events visible in the current viewport.
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$'
          example: "-10.5,35.0,40.0,60.0"
        category:
          type: array
          description: |
            EONET category ids to filter by; any value from `CategoryId`.
            Multiple values are OR-ed together.
          items:
            $ref: '#/components/schemas/CategoryId'
          example: ["wildfires", "volcanoes"]
        status:
          type: string
          description: Event lifecycle status. `open` = currently active.
          enum: [open, closed, all]
          default: open
        start:
          type: string
          format: date-time
          description: Only events with `eventDate >= start` (ISO 8601).
        end:
          type: string
          format: date-time
          description: Only events with `eventDate <= end` (ISO 8601).
        since:
          type: string
          format: date-time
          description: |
            Only events ingested into our DB after this timestamp.
            Used by the Notifier to poll for newly seen events without
            re-scanning the whole table.
        sort:
          type: string
          description: |
            Sort order for results. Default is most recent event first,
            which is what the map wants.
          enum:
            - eventDate:desc
            - eventDate:asc
            - ingestedAt:desc
            - ingestedAt:asc
          default: eventDate:desc
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 100
        offset:
          type: integer
          minimum: 0
          default: 0

    Event:
      type: object
      required: [id, title, category, status, eventDate, geometry]
      properties:
        id:
          type: string
          description: EONET event id; stable across updates.
          example: "EONET_6543"
        title:
          type: string
          example: "Wildfire - Sierra Nevada foothills"
        description:
          type: string
          nullable: true
        category:
          type: array
          items:
            $ref: '#/components/schemas/CategoryId'
          example: ["wildfires", "volcanoes"]
        status:
          type: string
          enum: [open, closed]
        eventDate:
          type: string
          format: date-time
        closedAt:
          type: string
          format: date-time
          nullable: true
          description: Set when the event closes; null while open.
        geometry:
          $ref: '#/components/schemas/Geometry'
        magnitudeValue:
          type: number
          nullable: true
          description: |
            EONET magnitude (e.g. acres burned for wildfires, VEI for
            volcanoes). Null when EONET does not publish one.
        magnitudeUnit:
          type: string
          nullable: true
          example: "acres"
        sourceUrl:
          type: string
          format: uri
          nullable: true
          description: Link to the primary external source for this event (e.g. InciWeb, USGS).
        ingestedAt:
          type: string
          format: date-time
          description: When this service first observed the event.
        updatedAt:
          type: string
          format: date-time

    Geometry:
      type: object
      description: GeoJSON-style point at the event's primary location.
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          type: array
          description: "[longitude, latitude] (GeoJSON order)."
          items: { type: number }
          minItems: 2
          maxItems: 2
          example: [-120.5, 39.1]

    Category:
      type: object
      required: [id, title]
      properties:
        id: { $ref: '#/components/schemas/CategoryId' }
        title: { type: string, example: "Wildfires" }

    EventPage:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Event' }
        total: { type: integer, example: 142 }
        limit: { type: integer, example: 100 }
        offset: { type: integer, example: 0 }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Machine-readable error identifier.
          enum:
            - invalid_bbox
            - invalid_date_range
            - invalid_category
            - invalid_sort
            - limit_out_of_range
            - event_not_found
            - unauthorized
          example: "invalid_bbox"
        message:
          type: string
          description: Human-readable explanation; do not parse.

  responses:
    BadRequest:
      description: Invalid request body / filters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid JWT.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Event not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
