openapi: 3.0.3

info:
  title: EarthPulse — LLM Briefing Service
  description: >
    Generates and serves AI-powered natural disaster briefings using a local
    LLM (Ollama) with read-through caching for performance and consistency.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Briefings
    description: AI-generated disaster briefings and cached summaries
  - name: Health
    description: Service health check

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    internalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret

  schemas:

    ReadingLevel:
      type: string
      enum:
        - DEFAULT
        - SIMPLIFIED
      description: >
        Controls the complexity and verbosity of the generated summary.

    Severity:
      type: string
      enum:
        - LOW
        - MODERATE
        - HIGH
        - UNKNOWN

    BriefingResponse:
      type: object
      description: >
        AI-generated disaster briefing associated with a single EONET event.
        Shared fields (impact, severity, precautions) are cached per event,
        while the summary is cached per (eventId, readingLevel).
      properties:
        eventId:
          type: string
          description: EONET event ID.
          example: "EONET_6543"

        readingLevel:
          $ref: '#/components/schemas/ReadingLevel'

        generatedAt:
          type: string
          format: date-time
          description: Timestamp when the briefing was generated or refreshed.

        summary:
          type: string
          example: >
            A wildfire has been spreading across the Sierra Nevada foothills
            since May 10, affecting nearby communities and reducing air quality.

        impact:
          type: string
          example: >
            Smoke may reduce air quality across nearby regions and disrupt
            local transportation routes.

        severity:
          $ref: '#/components/schemas/Severity'

        precautions:
          type: array
          items:
            type: string
          example:
            - Stay indoors if smoke is visible in your area
            - Follow evacuation instructions from local authorities

    ErrorMessage:
      type: string
      description: Plain-text error message.
      example: "Invalid event id"

    InternalAuthError:
      type: object
      description: Returned when the X-Internal-Secret header is missing or invalid.
      properties:
        error:
          type: string
          example: "Missing or invalid internal secret"

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - UP
            - DOWN
          example: UP

paths:

  /api/briefings/{eventId}:

    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
        description: EONET event ID.

    get:
      tags:
        - Briefings
      summary: Get briefing
      operationId: getBriefing

      security:
        - bearerAuth: []

      description: >
        Returns a briefing for the specified event.

        Read-through cache behavior:
        - If shared fields (impact, severity, precautions) are missing,
          they are generated and cached per event.
        - If the summary for the requested reading level is missing,
          it is generated and cached for (eventId, readingLevel).
        - If everything already exists, the cached result is returned
          without invoking the LLM.

      parameters:
        - name: readingLevel
          in: query
          required: true
          description: Controls the complexity of the generated summary.
          schema:
            $ref: '#/components/schemas/ReadingLevel'

        - name: magnitudeLevel
          in: query
          required: true
          description: >
            Numeric magnitude value from EONET, used to derive severity
            via category-specific thresholds. Pass 0 when no magnitude is available.
          schema:
            type: number
            format: double
            example: 30.0

        - name: category
          in: query
          required: true
          description: EONET event category (e.g. wildfires, severeStorms, volcanoes).
          schema:
            type: string
            example: wildfires

      responses:
        "200":
          description: Briefing returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefingResponse'

        "400":
          description: Event ID does not match the EONET_<digits> format.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

        "401":
          description: Missing or invalid JWT bearer token.

        "503":
          description: LLM service unavailable.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/internal/briefings:

    delete:
      tags:
        - Briefings
      summary: Delete all cached briefings
      operationId: cleanupBriefings

      security:
        - internalSecret: []

      description: >
        Internal cleanup endpoint used by backend services.
        Deletes all cached briefings from the database.

      responses:
        "204":
          description: All briefings were deleted successfully.

        "401":
          description: Missing or invalid X-Internal-Secret header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalAuthError'

  /api/internal/briefings/{eventId}:

    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
        description: EONET event ID.

    get:
      tags:
        - Briefings
      summary: Get briefing (internal)
      operationId: getInternalBriefing

      security:
        - internalSecret: []

      description: >
        Internal endpoint used by backend services.
        Returns a briefing for the specified event and reading level.

        Read-through cache behavior:
        - If shared fields (impact, severity, precautions) are missing,
          they are generated and cached per event.
        - If the summary for the requested reading level is missing,
          it is generated and cached for (eventId, readingLevel).
        - If everything already exists, the cached result is returned
          without invoking the LLM.

      parameters:
        - name: readingLevel
          in: query
          required: true
          description: Controls the complexity of the generated summary.
          schema:
            $ref: '#/components/schemas/ReadingLevel'

        - name: magnitudeLevel
          in: query
          required: true
          description: >
            Numeric magnitude value from EONET, used to derive severity
            via category-specific thresholds. Pass 0 when no magnitude is available.
          schema:
            type: number
            format: double
            example: 30.0

        - name: category
          in: query
          required: true
          description: EONET event category (e.g. wildfires, severeStorms, volcanoes).
          schema:
            type: string
            example: wildfires

      responses:
        "200":
          description: Briefing returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BriefingResponse'

        "400":
          description: Event ID does not match the EONET_<digits> format.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

        "401":
          description: Missing or invalid X-Internal-Secret header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalAuthError'

        "503":
          description: LLM service unavailable.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ErrorMessage'

  /api/health:
    get:
      tags:
        - Health
      summary: Health check
      operationId: healthCheck

      description: >
        Checks connectivity to the underlying Ollama LLM service.

      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

        "503":
          description: LLM service (Ollama) is unreachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

