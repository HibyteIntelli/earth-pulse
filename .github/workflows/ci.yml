name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
      repo: ${{ steps.repo.outputs.repo }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth:
              - 'auth/**'
            ingestion:
              - 'ingestion/**'
            llm:
              - 'llm/**'
            notifier:
              - 'notifier/**'
            frontend:
              - 'frontend/**'
      - id: repo
        run: echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

  build-test-java:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, ingestion, llm, notifier]
    env:
      SHOULD_RUN: ${{ contains(fromJSON(needs.changes.outputs.changes), matrix.service) }}
    steps:
      - uses: actions/checkout@v4
        if: env.SHOULD_RUN == 'true'
      - uses: actions/setup-java@v4
        if: env.SHOULD_RUN == 'true'
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - name: Build and test
        if: env.SHOULD_RUN == 'true'
        working-directory: ${{ matrix.service }}
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  build-test-frontend:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.changes), 'frontend')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  docker-java:
    needs: [changes, build-test-java]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth, ingestion, llm, notifier]
    env:
      SHOULD_BUILD: ${{ contains(fromJSON(needs.changes.outputs.changes), matrix.service) }}
      SHOULD_PUSH: ${{ github.event_name == 'push' && contains(fromJSON(needs.changes.outputs.changes), matrix.service) }}
    steps:
      - uses: actions/checkout@v4
        if: env.SHOULD_BUILD == 'true'
      - uses: docker/login-action@v3
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        if: env.SHOULD_BUILD == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ needs.changes.outputs.repo }}-${{ matrix.service }}:${{ github.sha }}
      - name: Scan image (report all severities to Security tab)
        if: env.SHOULD_BUILD == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ needs.changes.outputs.repo }}-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
      - name: Upload scan results to Security tab
        if: env.SHOULD_BUILD == 'true'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ matrix.service }}
      - name: Fail build on critical/high vulnerabilities
        if: env.SHOULD_BUILD == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ needs.changes.outputs.repo }}-${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Push image
        if: env.SHOULD_PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.changes.outputs.repo }}-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ needs.changes.outputs.repo }}-${{ matrix.service }}:${{ github.sha }}

  docker-frontend:
    needs: [changes, build-test-frontend]
    if: contains(fromJSON(needs.changes.outputs.changes), 'frontend')
    runs-on: ubuntu-latest
    env:
      SHOULD_PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: env.SHOULD_PUSH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: ${{ env.REGISTRY }}/${{ needs.changes.outputs.repo }}-frontend:${{ github.sha }}
      - name: Scan image (report all severities to Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ needs.changes.outputs.repo }}-frontend:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
      - name: Upload scan results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-frontend
      - name: Fail build on critical/high vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ needs.changes.outputs.repo }}-frontend:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Push image
        if: env.SHOULD_PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ needs.changes.outputs.repo }}-frontend:latest
            ${{ env.REGISTRY }}/${{ needs.changes.outputs.repo }}-frontend:${{ github.sha }}