services:
  llm:
    build:
      context: ./llm
      dockerfile: Dockerfile
    container_name: llm
    environment:
      OLLAMA_BASEURL: http://llm-ollama:11434
      OLLAMA_MODEL: llama3
      SPRING_DATASOURCE_URL: jdbc:postgresql://llm-postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth:8083/.well-known/jwks.json
      LLM_INTERNAL_SECRET: ${LLM_INTERNAL_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      llm-postgres:
        condition: service_healthy
      llm-ollama:
        condition: service_started

  llm-postgres:
    image: postgres:17.10
    container_name: llm-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - llm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  llm-ollama:
    image: ollama/ollama:0.31.1
    container_name: llm-ollama
    volumes:
      - llm-ollama-data:/root/.ollama
    entrypoint: >
      /bin/sh -c "
        ollama serve &
        sleep 5 &&
        ollama pull llama3 &&
        wait
      "

volumes:
  llm-postgres-data:
  llm-ollama-data:
