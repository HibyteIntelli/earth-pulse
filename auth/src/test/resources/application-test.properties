spring.application.name=auth-test

spring.datasource.url=jdbc:tc:postgresql:16:///testdb
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.base-url=http://localhost:8083

app.internal-secret=test-internal-secret-32-chars-long!!

app.rate-limit.login=1000
app.rate-limit.signup=1000
app.rate-limit.refill-duration=PT1M

app.generated-key-path=${java.io.tmpdir}/test-generated-jwk.json

app.avatar.storage-dir=${java.io.tmpdir}/test-avatar-store
app.avatar.public-base-url=http://localhost:8083/avatars
app.avatar.max-file-size-bytes=1048576
